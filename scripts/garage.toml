# Single-node Garage config for integration tests.
# s3_region must match AWS_REGION. Tests leave AWS_REGION unset, which signs as us-east-2.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

[s3_api]
s3_region = "us-east-2"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "s3dbdump-test-admin-token-0123456789abcdef"
metrics_token = "s3dbdump-test-metrics-token-0123456789abcdef"

---
name: s3dbdump CI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read

env:
  IMAGE_NAME: s3dbdump
  VERSIONTAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: testpass123
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: testpass123
      minio:
        image: quay.io/minio/minio:latest-cicd
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123
          MINIO_ACCESS_KEY: minio
          MINIO_SECRET_KEY: minio123
    steps:
      - uses: actions/checkout@v7

      - name: Integration test
        run: bash scripts/integration-test.sh
  build:
    name: Build and Push
    needs: [integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/stenstromen/${{ env.IMAGE_NAME }}:latest
            ghcr.io/stenstromen/${{ env.IMAGE_NAME }}:${{ env.VERSIONTAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  flux-update:
    needs: [build, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flux repository
        uses: actions/checkout@v7
        with:
          repository: stenstromen/flux
          token: ${{ secrets.KUBE_GITHUB_TOKEN }}
          path: flux-repo
          fetch-depth: 0

      - name: Fetch repository content
        run: |
          cd flux-repo
          git fetch origin
          git checkout main

      - name: Update CronJob image tag
        run: |
          CRONJOB_FILE="flux-repo/cronjobs/stinky/mariadb-backup-s3.yaml"
          OLD_IMAGE=$(grep "image:" "$CRONJOB_FILE" | awk '{print $2}')
          NEW_IMAGE="ghcr.io/stenstromen/s3dbdump:$VERSIONTAG"

          # Update the image tag
          sed -i "s|image:.*|image: $NEW_IMAGE|" "$CRONJOB_FILE"

          # Create commit message
          echo "Update image: $OLD_IMAGE -> $NEW_IMAGE" > commit_message.txt

      - name: Commit and Push Flux CronJob Update
        run: |
          cd flux-repo
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add cronjobs/stinky/mariadb-backup-s3.yaml
          if git diff --cached --quiet; then
            echo "Flux image tag is already ${VERSIONTAG}."
            exit 0
          fi
          git commit -F ../commit_message.txt
          if ! git push; then
            git pull --rebase origin main
            if git diff --quiet && git diff --cached --quiet; then
              echo "Flux image tag is already ${VERSIONTAG}."
              exit 0
            fi
            git push
          fi
